<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LineTrace • Shared AR World</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 100;
      background: rgba(0,0,0,0.6);
      padding: 12px;
      border-radius: 8px;
    }

    #thermal-ui {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 13px;
    }

    .thermal-nominal { color: #00ff88; }
    .thermal-hot { color: #ffcc00; font-weight: bold; }
    .thermal-critical { color: #ff4444; font-weight: bold; text-decoration: underline; }

    #status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #00ff88;
      z-index: 100;
      font-size: 12px;
    }

    .legend {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.4;
      color: #ddd;
    }

    .legend .item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
    }

    .legend .marker {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .legend .axis-x { background: #ff0000; }
    .legend .axis-y { background: #00ff00; }
    .legend .axis-z { background: #0000ff; }
    .legend .plane { background: rgba(0, 136, 255, 0.75); }
    .legend .pose { background: #ff6600; }
    .legend .surfel { background: #ffffff; border: 1px solid #444; }

    input, button {
      margin: 4px 0;
    }
  </style>
</head>

<body>

<div id="ui">
  Room:
  <input id="room" value="default" style="width:140px">

  <br/>

  <button onclick="joinRoom()">Join Room</button>
  <button onclick="startAR()">Enter AR</button>
  <button onclick="sendReset()">Clear World</button>

  <div class="legend">
    <div class="item"><span class="marker pose"></span>Device pose</div>
    <div class="item"><span class="marker axis-x"></span>X axis</div>
    <div class="item"><span class="marker axis-y"></span>Y axis</div>
    <div class="item"><span class="marker axis-z"></span>Z axis</div>
    <div class="item"><span class="marker plane"></span>Vertical plane</div>
    <div class="item"><span class="marker surfel"></span>Surfel cloud</div>
  </div>

  <div id="thermal-ui">
    Device Temp: <span id="thermal-value">--</span>°C
    <div id="thermal-status">Status: Unknown</div>
  </div>
</div>

<div id="status"></div>

<script>
  // =========================
  // CORE STATE
  // =========================

  let scene, camera, renderer, controls;
  let worldRoot = null;
  let ws = null;

  let currentRoom = "default";
  const paths = new Map();
  const poseMarkers = new Map();
  const planeMarkers = new Map();
  const poiMarkers = new Map();

  let surfelMesh = null;
  let surfelPoints = 0;
  const MAX_SURFELS = 500000;

  const MAX_POINTS = 2000;

  // =========================
  // LOGGING
  // =========================

  function log(msg) {
    document.getElementById('status').textContent = msg;
    console.log(msg);
  }

  // =========================
  // INIT THREE.JS WORLD
  // =========================

  async function init() {
    scene = new THREE.Scene();

    worldRoot = new THREE.Group();
    scene.add(worldRoot);

    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      200
    );

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Add Navigation Controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = false;
    controls.minDistance = 1;
    controls.maxDistance = 100;
    controls.maxPolarAngle = Math.PI / 2;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    scene.add(new THREE.HemisphereLight(0xbbbbff, 0x444422, 0.8));

    // Ground grid
    const grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
    scene.add(grid);

    camera.position.set(0, 8, 15);
    camera.lookAt(0, 0, 0);

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    renderer.setAnimationLoop(() => {
      if (controls) controls.update();
      renderer.render(scene, camera);
    });

    log("Scene ready → Join a room or enter AR");
  }

  // =========================
  // ROOM / WEBSOCKET
  // =========================

  function joinRoom() {
    currentRoom = document.getElementById('room').value || 'default';

    if (ws) {
      ws.manualClose = true;
      ws.close();
    }

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const host = window.location.host;

    ws = new WebSocket(
      `${protocol}://${host}/?room=${currentRoom}&user=web_${Math.random().toString(36).slice(2)}`
    );
    ws.manualClose = false;

    ws.onopen = () => {
      log(`Connected → Room: ${currentRoom}`);
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        console.log(`📥 [${msg.type || 'unknown'}]`, msg);

        if (msg.type === 'anchor' && msg.anchor) {
          // Alignment Fix: Use pre-negated coordinates from Android directly
          if (worldRoot) {
            worldRoot.position.set(msg.anchor.x || 0, msg.anchor.y || 0, msg.anchor.z || 0);
          }
          if (msg.pois && Array.isArray(msg.pois)) {
            msg.pois.forEach(p => handlePoi(p));
          }
        }

        if (msg.type === 'path_point') handlePathPoint(msg);
        if (msg.type === 'pose') handlePose(msg);
        if (msg.type === 'poi') handlePoi(msg);
        if (msg.type === 'ar_vertical_plane') handleVerticalPlane(msg);
        if (msg.type === 'world_delta') handleWorldDelta(msg);
        if (msg.type === 'thermal_heartbeat') handleThermalHeartbeat(msg);
        if (msg.type === 'reset_world') resetWorld();
      } catch (err) {
        console.warn('Bad message', err, e.data);
      }
    };

    ws.onerror = (event) => {
      console.warn('WebSocket connection error', event);
      log('WebSocket connection failed');
    };

    ws.onclose = () => {
      log('WebSocket disconnected');
      // Auto-reconnect with exponential backoff if possible, or simple 3s
      if (!ws.manualClose) {
        setTimeout(joinRoom, 3000);
      }
    };
  }

  function resetWorld() {
    log("World Reset Received");

    // Clear Paths
    paths.forEach(line => {
      worldRoot.remove(line.mesh);
      if (line.mesh.geometry) line.mesh.geometry.dispose();
      if (line.mesh.material) line.mesh.material.dispose();
    });
    paths.clear();

    // Clear Poses
    poseMarkers.forEach(marker => worldRoot.remove(marker));
    poseMarkers.clear();

    // Clear Planes
    planeMarkers.forEach(plane => worldRoot.remove(plane));
    planeMarkers.clear();

    // Clear POIs
    poiMarkers.forEach(poi => worldRoot.remove(poi));
    poiMarkers.clear();

    // Clear Surfels
    if (surfelMesh) {
      worldRoot.remove(surfelMesh);
      if (surfelMesh.geometry) surfelMesh.geometry.dispose();
      if (surfelMesh.material) surfelMesh.material.dispose();
      surfelMesh = null;
      surfelPoints = 0;
    }

    // Reset Anchor
    if (worldRoot) worldRoot.position.set(0, 0, 0);
  }

  // =========================
  // PATH HANDLING (GPU SAFE)
  // =========================

  function handlePathPoint(msg) {
    let line = paths.get(msg.user);

    // Create new user path if needed
    if (!line) {
      const geometry = new THREE.BufferGeometry();

      const positions = new Float32Array(MAX_POINTS * 3);

      geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
      );

      const material = new THREE.LineBasicMaterial({
        color: 0x00ff88
      });

      const mesh = new THREE.Line(geometry, material);

      line = {
        mesh,
        index: 0
      };

      worldRoot.add(mesh);
      paths.set(msg.user, line);
    }

    const obj = line;
    const array = obj.mesh.geometry.attributes.position.array;

    const i = obj.index * 3;

    const p = msg.point || { x: msg.x || 0, y: msg.y || 0, z: msg.z || 0 };

    // Write point into buffer
    array[i] = p.x;
    array[i + 1] = p.y;
    array[i + 2] = p.z;

    obj.index = (obj.index + 1) % MAX_POINTS;

    obj.mesh.geometry.attributes.position.needsUpdate = true;
  }

  function handleThermalHeartbeat(msg) {
    if (!msg.data || msg.data.celsius == null) return;

    const temp = msg.data.celsius;
    const status = msg.data.status || "UNKNOWN";

    const valueEl = document.getElementById('thermal-value');
    const statusEl = document.getElementById('thermal-status');

    valueEl.textContent = temp.toFixed(1);
    statusEl.textContent = `Status: ${status}`;

    // Update CSS classes
    statusEl.className = '';
    if (status === 'NOMINAL') statusEl.classList.add('thermal-nominal');
    else if (status === 'HOT') statusEl.classList.add('thermal-hot');
    else if (status === 'CRITICAL') statusEl.classList.add('thermal-critical');
  }

  function handlePose(msg) {
    if (!msg.state || !msg.state.pos) return;

    const user = msg.user || msg.node || 'device_ar';
    let marker = poseMarkers.get(user);

    if (!marker) {
      marker = new THREE.Group();

      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xff6600 })
      );
      sphere.position.set(0, 0, 0);
      marker.add(sphere);

      const axisLength = 0.5;
      const createAxis = (color, dir) => {
        const material = new THREE.LineBasicMaterial({ color });
        const geometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(dir.x * axisLength, dir.y * axisLength, dir.z * axisLength),
        ]);
        return new THREE.Line(geometry, material);
      };

      marker.add(createAxis(0xff0000, { x: 1, y: 0, z: 0 }));
      marker.add(createAxis(0x00ff00, { x: 0, y: 1, z: 0 }));
      marker.add(createAxis(0x0000ff, { x: 0, y: 0, z: 1 }));

      worldRoot.add(marker);
      poseMarkers.set(user, marker);
    }

    marker.position.set(
      msg.state.pos.x || 0,
      msg.state.pos.y || 0,
      msg.state.pos.z || 0
    );

    if (msg.state.rot) {
      marker.quaternion.set(
        msg.state.rot.x || 0,
        msg.state.rot.y || 0,
        msg.state.rot.z || 0,
        msg.state.rot.w != null ? msg.state.rot.w : 1
      );
    }
  }

  function handleVerticalPlane(msg) {
    if (!msg.pos || typeof msg.height !== 'number') return;

    const id = msg.user || `${msg.type}_${msg.timestamp || Date.now()}`;
    let plane = planeMarkers.get(id);

    if (!plane) {
      const geometry = new THREE.PlaneGeometry(1, 1);
      const material = new THREE.MeshBasicMaterial({
        color: 0x0088ff,
        transparent: true,
        opacity: Math.min(Math.max(msg.alpha ?? 0.25, 0.1), 0.85),
        side: THREE.DoubleSide,
      });
      plane = new THREE.Mesh(geometry, material);
      plane.rotation.x = Math.PI / 2;
      worldRoot.add(plane);
      planeMarkers.set(id, plane);
    }

    plane.position.set(msg.pos.x || 0, (msg.height / 2) || 0.5, msg.pos.z || 0);
    plane.scale.set(1, msg.height || 1, 1);
  }

  function handlePoi(msg) {
    const x = msg.x != null ? msg.x : (msg.pos?.x || 0);
    const y = msg.y != null ? msg.y : (msg.pos?.y || 0);
    const z = msg.z != null ? msg.z : (msg.pos?.z || 0);

    const id = msg.id || `${x}_${y}_${z}`;
    if (poiMarkers.has(id)) return;

    const geometry = new THREE.SphereGeometry(0.12, 16, 16);
    const material = new THREE.MeshStandardMaterial({
      color: 0xffff00,
      emissive: 0x444400
    });
    const sphere = new THREE.Mesh(geometry, material);
    sphere.position.set(x, y, z);

    worldRoot.add(sphere);
    poiMarkers.set(id, sphere);
  }

  // =========================
  // SURFEL CLOUD HANDLING
  // =========================

  function initSurfelMesh() {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_SURFELS * 3), 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAX_SURFELS * 3), 3));

    const material = new THREE.PointsMaterial({
      size: 0.04,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      sizeAttenuation: true
    });

    surfelMesh = new THREE.Points(geometry, material);
    worldRoot.add(surfelMesh);
    log("Surfel cloud initialized");
  }

  function handleWorldDelta(msg) {
    if (!msg.surfelData) return;

    if (!surfelMesh) initSurfelMesh();

    try {
      // Fast Base64 decode
      const binaryString = atob(msg.surfelData);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      const dataView = new DataView(bytes.buffer);
      const surfelCountInDelta = Math.floor(bytes.length / 64);

      const posAttr = surfelMesh.geometry.attributes.position;
      const colorAttr = surfelMesh.geometry.attributes.color;

      for (let i = 0; i < surfelCountInDelta; i++) {
        const offset = i * 64;
        // Circular buffer or linear fill? Linear for now until 500k
        const idx = (surfelPoints + i) % MAX_SURFELS;

        // posRadius: vec4 (x, y, z, r) @ 0-15 bytes
        const x = dataView.getFloat32(offset + 0, true);
        const y = dataView.getFloat32(offset + 4, true);
        const z = dataView.getFloat32(offset + 8, true);

        // color: vec4 (r, g, b, a) @ 32-47 bytes
        const r = dataView.getFloat32(offset + 32, true);
        const g = dataView.getFloat32(offset + 36, true);
        const b = dataView.getFloat32(offset + 40, true);

        posAttr.setXYZ(idx, x, y, z);
        colorAttr.setXYZ(idx, r, g, b);
      }

      surfelPoints += surfelCountInDelta;

      posAttr.needsUpdate = true;
      colorAttr.needsUpdate = true;

      // Update draw range to show all points up to the limit
      surfelMesh.geometry.setDrawRange(0, Math.min(surfelPoints, MAX_SURFELS));

      if (Math.random() < 0.05) {
        log(`Surfels: ${surfelPoints.toLocaleString()} (+${surfelCountInDelta})`);
      }
    } catch (e) {
      console.warn("Failed to decode surfel delta", e);
    }
  }

  // =========================
  // AR STARTUP
  // =========================

  async function startAR() {
    if (!navigator.xr) {
      log("WebXR not supported");
      return;
    }

    try {
      // Move hit-test to optional to avoid "not supported" crashes on some devices/emulators
      const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: ["local"],
        optionalFeatures: ["local-floor", "hit-test"]
      });

      renderer.xr.setSession(session);
      log("AR session active");
    } catch (err) {
      log("AR failed: " + err.message);
      console.error(err);
    }
  }

  // =========================
  // BOOT
  // =========================

  window.onload = init;
</script>

</body>
</html>
