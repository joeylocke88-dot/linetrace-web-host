<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LineTrace • Shared AR World</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 100;
      background: rgba(0,0,0,0.6);
      padding: 12px;
      border-radius: 8px;
    }

    #status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #00ff88;
      z-index: 100;
      font-size: 12px;
    }

    input, button {
      margin: 4px 0;
    }
  </style>
</head>

<body>

<div id="ui">
  Room:
  <input id="room" value="default" style="width:140px">

  <br/>

  <button onclick="joinRoom()">Join Room</button>
  <button onclick="startAR()">Enter AR</button>
</div>

<div id="status"></div>

<script>
  // =========================
  // CORE STATE
  // =========================

  let scene, camera, renderer;
  let ws = null;

  let currentRoom = "default";
  const paths = new Map();

  const MAX_POINTS = 2000;

  // =========================
  // LOGGING
  // =========================

  function log(msg) {
    document.getElementById('status').textContent = msg;
    console.log(msg);
  }

  // =========================
  // INIT THREE.JS WORLD
  // =========================

  async function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      200
    );

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    scene.add(new THREE.HemisphereLight(0xbbbbff, 0x444422, 0.8));

    // Ground grid
    const grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
    scene.add(grid);

    camera.position.set(0, 8, 15);
    camera.lookAt(0, 0, 0);

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

    log("Scene ready → Join a room or enter AR");
  }

  // =========================
  // ROOM / WEBSOCKET
  // =========================

  function joinRoom() {
    currentRoom = document.getElementById('room').value || 'default';

    if (ws) ws.close();

    ws = new WebSocket(
      `wss://linetrace-server-5vj2.onrender.com?room=${currentRoom}&user=web_${Math.random().toString(36).slice(2)}`
    );

    ws.onopen = () => {
      log(`Connected → Room: ${currentRoom}`);
    };

    ws.onmessage = (e) => {if (msg.type === "anchor") {
  coord.setOrigin(msg.anchor);
}
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === "path_point") handlePathPoint(msg);
      } catch (err) {
        console.warn("Bad message", err);
      }
    };

    ws.onerror = () => log("WebSocket error");
    ws.onclose = () => log("Disconnected");
  }
ws.send(JSON.stringify({
  type: "anchor",
  anchor: globalAnchor
}));
  // =========================
  // PATH HANDLING (GPU SAFE)
  // =========================

  function handlePathPoint(msg) {
    let line = paths.get(msg.user);

    // Create new user path if needed
    if (!line) {
      const geometry = new THREE.BufferGeometry();

      const positions = new Float32Array(MAX_POINTS * 3);

      geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
      );

      const material = new THREE.LineBasicMaterial({
        color: 0x00ff88
      });

      const mesh = new THREE.Line(geometry, material);

      line = {
        mesh,
        index: 0
      };

      scene.add(mesh);
      paths.set(msg.user, line);
    }

    const obj = line;
    const array = obj.mesh.geometry.attributes.position.array;

    const i = obj.index * 3;

    const p = msg.point || { x: 0, y: 0, z: 0 };

    // Write point into buffer
    array[i] = p.x;
    array[i + 1] = p.y;
    array[i + 2] = p.z;

    obj.index = (obj.index + 1) % MAX_POINTS;

    obj.mesh.geometry.attributes.position.needsUpdate = true;
  }

  // =========================
  // AR STARTUP
  // =========================

  async function startAR() {
    if (!navigator.xr) {
      log("WebXR not supported");
      return;
    }

    try {
      const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: [],
        optionalFeatures: ["local-floor", "hit-test"]
      });

      renderer.xr.setSession(session);
      log("AR session active");
    } catch (err) {
      log("AR failed: " + err.message);
      console.error(err);
    }
  }

  // =========================
  // BOOT
  // =========================

  window.onload = init;
</script>

</body>
</html>
