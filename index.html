<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LineTrace • Shared AR World</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <style>
    body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; }
    #ui { position:absolute; top:10px; left:10px; color:white; z-index:100; background:rgba(0,0,0,0.6); padding:12px; border-radius:8px; }
  </style>
</head>
<body>
<div id="ui">
  Room: <input id="room" value="default" style="width:140px"> 
  <button onclick="joinRoom()">Join Room</button>
  <button onclick="startAR()">Enter AR</button>
</div>

<script>
  let scene, camera, renderer, ws = null;
  let currentRoom = "default";
  const paths = new Map();   // userId → Line

  async function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 200);
    renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1));
    scene.add(new THREE.HemisphereLight(0xbbbbff, 0x444422, 0.8));

    const grid = new THREE.GridHelper(100, 50);
    scene.add(grid);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => renderer.render(scene, camera));
  }

  function joinRoom() {
    currentRoom = document.getElementById('room').value || 'default';
    if (ws) ws.close();

    const wsUrl = `wss://linetrace-host.onrender.com?room=${currentRoom}&user=web_${Math.random().toString(36).slice(2)}`;
    ws = new WebSocket(wsUrl);

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "path_point") handlePathPoint(msg);
    };
  }

  function handlePathPoint(msg) {
    let line = paths.get(msg.user);
    if (!line) {
      const mat = new THREE.LineBasicMaterial({color: 0x00ff88});
      const geo = new THREE.BufferGeometry();
      line = new THREE.Line(geo, mat);
      scene.add(line);
      paths.set(msg.user, line);
    }
    const positions = line.geometry.attributes.position?.array || [];
    const newPos = [...positions, msg.point.x, msg.point.y, msg.point.z];
    line.geometry.setAttribute('position', new THREE.Float32BufferAttribute(newPos, 3));
    line.geometry.attributes.position.needsUpdate = true;
  }

  async function startAR() {
    if (!navigator.xr) return alert("WebXR not supported on this device");
    try {
      const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: ["local-floor"]
      });
      renderer.xr.setSession(session);
      console.log("✅ AR Session Started");
    } catch (err) {
      alert("AR failed: " + err.message);
    }
  }

  window.onload = init;
</script>
</body>
</html>
