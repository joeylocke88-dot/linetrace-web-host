<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LineTrace • Shared AR World</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050F19; /* deep_navy */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #00E5FF; /* neon_cyan */
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: rgba(5, 15, 25, 0.85); /* deep_navy with alpha */
      padding: 15px;
      border: 1px solid #00E5FF; /* neon_cyan border */
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    #thermal-ui {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 229, 255, 0.3);
      font-size: 13px;
    }

    .thermal-nominal { color: #00E676; } /* tactical_green */
    .thermal-hot { color: #FFEA00; font-weight: bold; } /* tactical_yellow */
    .thermal-critical { color: #FF1744; font-weight: bold; text-decoration: underline; } /* tactical_red */

    #status {
      position: absolute;
      bottom: 15px;
      left: 15px;
      color: #00E5FF;
      z-index: 100;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .legend {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.4;
      color: #ddd;
    }

    .legend .item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
    }

    .legend .marker {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .legend .axis-x { background: #FF1744; }
    .legend .axis-y { background: #00E676; }
    .legend .axis-z { background: #00E5FF; }
    .legend .plane { background: rgba(0, 229, 255, 0.6); }
    .legend .pose { background: #FF9800; }
    .legend .surfel { background: #FFFFFF; border: 1px solid #00E5FF; }

    input {
      background: #050F19;
      border: 1px solid #00E5FF;
      color: #00E5FF;
      padding: 4px 8px;
      margin-bottom: 8px;
    }

    button {
      background: transparent;
      border: 1px solid #00E5FF;
      color: #00E5FF;
      padding: 6px 12px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      transition: all 0.2s;
    }

    button:hover {
      background: rgba(0, 229, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }
  </style>
</head>

<body>

<div id="ui">
  Room:
  <input id="room" value="default" style="width:140px">

  <br/>

  <button onclick="joinRoom()">Join Room</button>
  <button onclick="startAR()">Enter AR</button>
  <button onclick="sendReset()">Clear World</button>

  <div class="legend">
    <div class="item"><span class="marker pose"></span>Device pose</div>
    <div class="item"><span class="marker axis-x"></span>X axis</div>
    <div class="item"><span class="marker axis-y"></span>Y axis</div>
    <div class="item"><span class="marker axis-z"></span>Z axis</div>
    <div class="item"><span class="marker plane"></span>Vertical plane</div>
    <div class="item"><span class="marker surfel"></span>Surfel cloud</div>
  </div>

  <div id="thermal-ui">
    Device Temp: <span id="thermal-value">--</span>°C
    <div id="thermal-status">Status: Unknown</div>
  </div>
</div>

<div id="status"></div>

<script>
  // =========================
  // CORE STATE
  // =========================

  let scene, camera, renderer, controls;
  let worldRoot = null;
  let ws = null;

  let currentRoom = "default";
  const paths = new Map();
  const poseMarkers = new Map();
  const planeMarkers = new Map();
  const poiMarkers = new Map();

  let surfelMesh = null;
  let surfelPoints = 0;
  const MAX_SURFELS = 500000;

  const MAX_POINTS = 2000;

  // =========================
  // LOGGING
  // =========================

  function log(msg) {
    document.getElementById('status').textContent = msg;
    console.log(msg);
  }

  // =========================
  // INIT THREE.JS WORLD
  // =========================

  async function init() {
    scene = new THREE.Scene();

    worldRoot = new THREE.Group();
    scene.add(worldRoot);

    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      200
    );

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Add Navigation Controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = false;
    controls.minDistance = 1;
    controls.maxDistance = 100;
    controls.maxPolarAngle = Math.PI / 2;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    scene.add(new THREE.HemisphereLight(0xbbbbff, 0x444422, 0.8));

    // Ground grid
    const grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
    scene.add(grid);

    camera.position.set(0, 8, 15);
    camera.lookAt(0, 0, 0);

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    renderer.setAnimationLoop(() => {
      if (controls) controls.update();
      renderer.render(scene, camera);
    });

    log("Scene ready → Join a room or enter AR");
  }

  // =========================
  // ROOM / WEBSOCKET
  // =========================

  function joinRoom() {
    currentRoom = document.getElementById('room').value || 'default';

    if (ws) {
      ws.manualClose = true;
      ws.close();
    }

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const host = window.location.host;

    ws = new WebSocket(
      `${protocol}://${host}/?room=${currentRoom}&user=web_${Math.random().toString(36).slice(2)}`
    );
    ws.binaryType = 'arraybuffer';
    ws.manualClose = false;

    ws.onopen = () => {
      log(`Connected → Room: ${currentRoom}`);
    };

    ws.onmessage = (e) => {
      // 🚀 Zero-Overhead Binary Path
      if (e.data instanceof ArrayBuffer) {
          handleBinaryMessage(e.data);
          return;
      }

      try {
        const msg = JSON.parse(e.data);
        console.log(`📥 [${msg.type || 'unknown'}]`, msg);

        if (msg.type === 'anchor' && msg.anchor) {
          // Alignment Fix: Use pre-negated coordinates from Android directly
          if (worldRoot) {
            worldRoot.position.set(msg.anchor.x || 0, msg.anchor.y || 0, msg.anchor.z || 0);
          }
          if (msg.pois && Array.isArray(msg.pois)) {
            msg.pois.forEach(p => handlePoi(p));
          }
        }

        if (msg.type === 'path_point') handlePathPoint(msg);
        if (msg.type === 'pose') handlePose(msg);
        if (msg.type === 'imu') handlePose(msg); // Treat IMU like a pose for visualizer heartbeats
        if (msg.type === 'poi') handlePoi(msg);
        if (msg.type === 'ar_anchor') {
           if (msg.anchor && worldRoot) {
               worldRoot.position.set(msg.anchor.x || 0, msg.anchor.y || 0, msg.anchor.z || 0);
           }
        }
        if (msg.type === 'ar_vertical_plane') handleVerticalPlane(msg);
        if (msg.type === 'world_delta') handleWorldDelta(msg);
        if (msg.type === 'thermal_heartbeat') handleThermalHeartbeat(msg);
        if (msg.type === 'reset_world') resetWorld();
      } catch (err) {
        console.warn('Bad message', err, e.data);
      }
    };

    ws.onerror = (event) => {
      console.warn('WebSocket connection error', event);
      log('WebSocket connection failed');
    };

    ws.onclose = () => {
      log('WebSocket disconnected');
      if (!ws.manualClose) {
        setTimeout(joinRoom, 3000);
      }
    };
  }

  function handleBinaryMessage(buffer) {
      const dataView = new DataView(buffer);
      const type = dataView.getInt8(0);
      
      if (type === 0x02) { // TYPE_WORLD_DELTA
          // Format: [Type:1][Timestamp:8][SenderMSB:8][SenderLSB:8][SurfelData:N]
          const surfelData = buffer.slice(25);
          handleWorldDelta({ surfelData });
      } else if (type === 0x01) { // TYPE_POINT_CLOUD (Raw)
          const points = new Float32Array(buffer, 9);
          handleRawPointCloud(points);
      } else if (type === 0x03) { // TYPE_CAMERA_POSE
          // Format: [Type:1][Timestamp:8][Matrix:64]
          const matrix = new Float32Array(buffer, 9, 16);
          handlePose({
              user: 'remote_gpu',
              state: {
                  pos: { x: matrix[12], y: matrix[13], z: matrix[14] },
                  rot: null 
              }
          });
      }
  }

  function resetWorld() {
    log("World Reset Received");

    paths.forEach(line => {
      worldRoot.remove(line.mesh);
      if (line.mesh.geometry) line.mesh.geometry.dispose();
      if (line.mesh.material) line.mesh.material.dispose();
    });
    paths.clear();

    poseMarkers.forEach(marker => worldRoot.remove(marker));
    poseMarkers.clear();

    planeMarkers.forEach(plane => worldRoot.remove(plane));
    planeMarkers.clear();

    poiMarkers.forEach(poi => worldRoot.remove(poi));
    poiMarkers.clear();

    if (surfelMesh) {
      worldRoot.remove(surfelMesh);
      if (surfelMesh.geometry) surfelMesh.geometry.dispose();
      if (surfelMesh.material) surfelMesh.material.dispose();
      surfelMesh = null;
      surfelPoints = 0;
    }

    if (worldRoot) worldRoot.position.set(0, 0, 0);
  }

  // =========================
  // PATH HANDLING (GPU SAFE)
  // =========================

  function handlePathPoint(msg) {
    let line = paths.get(msg.user);

    if (!line) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(MAX_POINTS * 3);
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.LineBasicMaterial({ color: 0x00E5FF });
      const mesh = new THREE.Line(geometry, material);
      line = { mesh, index: 0 };
      worldRoot.add(mesh);
      paths.set(msg.user, line);
    }

    const obj = line;
    const array = obj.mesh.geometry.attributes.position.array;
    const i = obj.index * 3;
    const p = msg.point || { x: msg.x || 0, y: msg.y || 0, z: msg.z || 0 };

    array[i] = p.x;
    array[i + 1] = p.y;
    array[i + 2] = p.z;

    obj.index = (obj.index + 1) % MAX_POINTS;
    obj.mesh.geometry.attributes.position.needsUpdate = true;
  }

  function handleThermalHeartbeat(msg) {
    if (!msg.data || msg.data.celsius == null) return;
    const temp = msg.data.celsius;
    const status = msg.data.status || "UNKNOWN";
    const valueEl = document.getElementById('thermal-value');
    const statusEl = document.getElementById('thermal-status');
    valueEl.textContent = temp.toFixed(1);
    statusEl.textContent = `Status: ${status}`;
    statusEl.className = '';
    if (status === 'NOMINAL') statusEl.classList.add('thermal-nominal');
    else if (status === 'HOT') statusEl.classList.add('thermal-hot');
    else if (status === 'CRITICAL') statusEl.classList.add('thermal-critical');
  }

  function handlePose(msg) {
    if (!msg.state || !msg.state.pos) return;

    const user = msg.user || msg.node || 'device_ar';
    let marker = poseMarkers.get(user);

    if (!marker) {
      marker = new THREE.Group();
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xFF9800, emissive: 0xFF9800, emissiveIntensity: 0.5 })
      );
      sphere.position.set(0, 0, 0);
      marker.add(sphere);

      const axisLength = 0.5;
      const createAxis = (color, dir) => {
        const material = new THREE.LineBasicMaterial({ color });
        const geometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(dir.x * axisLength, dir.y * axisLength, dir.z * axisLength),
        ]);
        return new THREE.Line(geometry, material);
      };

      marker.add(createAxis(0xFF1744, { x: 1, y: 0, z: 0 })); // tactical_red
      marker.add(createAxis(0x00E676, { x: 0, y: 1, z: 0 })); // tactical_green
      marker.add(createAxis(0x00E5FF, { x: 0, y: 0, z: 1 })); // neon_cyan

      worldRoot.add(marker);
      poseMarkers.set(user, marker);
    }

    marker.position.set(
      msg.state.pos.x || 0,
      msg.state.pos.y || 0,
      msg.state.pos.z || 0
    );

    if (msg.state.rot) {
      marker.quaternion.set(
        msg.state.rot.x || 0,
        msg.state.rot.y || 0,
        msg.state.rot.z || 0,
        msg.state.rot.w != null ? msg.state.rot.w : 1
      );
    }
  }

  function handleRawPointCloud(points) {
    if (!surfelMesh) initSurfelMesh();
    const posAttr = surfelMesh.geometry.attributes.position;
    const colorAttr = surfelMesh.geometry.attributes.color;
    const count = Math.floor(points.length / 4);

    for (let i = 0; i < count; i++) {
      const idx = (surfelPoints + i) % MAX_SURFELS;
      posAttr.setXYZ(idx, points[i*4], points[i*4+1], points[i*4+2]);
      // Use confidence (points[i*4+3]) to tint color
      const conf = Math.min(Math.max(points[i*4+3], 0), 1);
      colorAttr.setXYZ(idx, 0.0, 0.9, 1.0); // Tint towards neon_cyan
    }
    surfelPoints += count;
    posAttr.needsUpdate = true;
    colorAttr.needsUpdate = true;
    surfelMesh.geometry.setDrawRange(0, Math.min(surfelPoints, MAX_SURFELS));
  }

  function handleVerticalPlane(msg) {
    if (!msg.pos || typeof msg.height !== 'number') return;

    const id = msg.user || `${msg.type}_${msg.timestamp || Date.now()}`;
    let plane = planeMarkers.get(id);

    if (!plane) {
      const geometry = new THREE.PlaneGeometry(1, 1);
      const material = new THREE.MeshBasicMaterial({
        color: 0x00E5FF,
        transparent: true,
        opacity: Math.min(Math.max(msg.alpha ?? 0.25, 0.1), 0.85),
        side: THREE.DoubleSide,
      });
      plane = new THREE.Mesh(geometry, material);
      plane.rotation.x = Math.PI / 2;
      worldRoot.add(plane);
      planeMarkers.set(id, plane);
    }

    plane.position.set(msg.pos.x || 0, (msg.height / 2) || 0.5, msg.pos.z || 0);
    plane.scale.set(1, msg.height || 1, 1);
  }

  function handlePoi(msg) {
    const x = msg.x != null ? msg.x : (msg.pos?.x || 0);
    const y = msg.y != null ? msg.y : (msg.pos?.y || 0);
    const z = msg.z != null ? msg.z : (msg.pos?.z || 0);

    const id = msg.id || `${x}_${y}_${z}`;
    if (poiMarkers.has(id)) return;

    const geometry = new THREE.SphereGeometry(0.12, 16, 16);
    const material = new THREE.MeshStandardMaterial({ color: 0xFFEA00, emissive: 0xFFEA00, emissiveIntensity: 0.5 });
    const sphere = new THREE.Mesh(geometry, material);
    sphere.position.set(x, y, z);
    worldRoot.add(sphere);
    poiMarkers.set(id, sphere);
  }

  // =========================
  // SURFEL CLOUD HANDLING
  // =========================

  function initSurfelMesh() {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_SURFELS * 3), 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAX_SURFELS * 3), 3));

    const material = new THREE.PointsMaterial({
      size: 0.04,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      sizeAttenuation: true
    });

    surfelMesh = new THREE.Points(geometry, material);
    worldRoot.add(surfelMesh);
    log("Surfel cloud initialized");
  }

  function handleWorldDelta(msg) {
    if (!msg.surfelData) return;
    if (!surfelMesh) initSurfelMesh();

    try {
      let bytes;
      if (typeof msg.surfelData === 'string') {
          const binaryString = atob(msg.surfelData);
          bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
      } else {
          bytes = new Uint8Array(msg.surfelData);
      }

      const dataView = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const surfelCountInDelta = Math.floor(bytes.length / 64);

      const posAttr = surfelMesh.geometry.attributes.position;
      const colorAttr = surfelMesh.geometry.attributes.color;

      for (let i = 0; i < surfelCountInDelta; i++) {
        const offset = i * 64;
        const idx = (surfelPoints + i) % MAX_SURFELS;

        const x = dataView.getFloat32(offset + 0, true);
        const y = dataView.getFloat32(offset + 4, true);
        const z = dataView.getFloat32(offset + 8, true);

        const r = dataView.getFloat32(offset + 32, true);
        const g = dataView.getFloat32(offset + 36, true);
        const b = dataView.getFloat32(offset + 40, true);

        posAttr.setXYZ(idx, x, y, z);
        colorAttr.setXYZ(idx, r, g, b);
      }

      surfelPoints += surfelCountInDelta;
      posAttr.needsUpdate = true;
      colorAttr.needsUpdate = true;
      surfelMesh.geometry.setDrawRange(0, Math.min(surfelPoints, MAX_SURFELS));

      if (Math.random() < 0.05) {
        log(`Surfels: ${surfelPoints.toLocaleString()} (+${surfelCountInDelta})`);
      }
    } catch (e) {
      console.warn("Failed to decode surfel delta", e);
    }
  }

  // =========================
  // AR STARTUP
  // =========================

  async function startAR() {
    if (!navigator.xr) {
      log("WebXR not supported");
      return;
    }
    try {
      const session = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: ["local"],
        optionalFeatures: ["local-floor", "hit-test"]
      });
      renderer.xr.setSession(session);
      log("AR session active");
    } catch (err) {
      log("AR failed: " + err.message);
      console.error(err);
    }
  }

  window.onload = init;
</script>

</body>
</html>
